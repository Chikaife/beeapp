<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password · beeapp</title>
    <link rel="icon" type="image/png" href="chidi logo.png" sizes="32x32">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/auth.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/core.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body>

<main class="auth">
    <div class="auth-wrap" data-page="reset">
        <div class="auth-card">
            <a class="auth-brand" href="index">beeapp</a>

            <div class="auth-steps" aria-label="Reset progress">
                <span class="step is-current" data-step-index="0">
                    <span class="step-n">1</span><span>Identify</span>
                </span>
                <span class="step-sep"></span>
                <span class="step" data-step-index="1">
                    <span class="step-n">2</span><span>Verify</span>
                </span>
                <span class="step-sep"></span>
                <span class="step" data-step-index="2">
                    <span class="step-n">3</span><span>New password</span>
                </span>
            </div>

            <section data-auth-step="0">
                <h1>Reset password</h1>
                <p class="auth-sub">Use the phone number or email address on your beeapp account.</p>

                <form id="reset-identify" novalidate>
                    <div class="field">
                        <label for="reset-identifier">Phone number or email</label>
                        <input class="input" id="reset-identifier" data-input="identifier" type="text"
                               autocapitalize="none" spellcheck="false">
                        <p class="field-error" data-error="identifier" hidden></p>
                    </div>

                    <div class="auth-actions">
                        <button class="btn btn-primary btn-lg btn-block" type="submit">Continue</button>
                    </div>
                </form>

                <div class="auth-divider"></div>
                <p class="auth-alt"><a href="index">Back to sign in</a></p>
            </section>

            <section data-auth-step="1" hidden>
                <h1>Enter the 6-digit code</h1>
                <p class="auth-sub">Sent to <b data-reset-mask></b> · <button class="btn-link" type="button" data-change-account>Change</button></p>

                <form id="reset-verify" novalidate>
                    <div class="field">
                        <label for="reset-otp">Verification code</label>
                        <input class="input otp-input" id="reset-otp" type="text" inputmode="numeric"
                               maxlength="6" autocomplete="one-time-code" placeholder="••••••">
                        <p class="field-error" data-error="otp" hidden></p>
                    </div>

                    <div class="auth-actions">
                        <button class="btn btn-primary btn-lg btn-block" type="submit">Verify</button>
                        <button class="btn btn-quiet btn-block" type="button" data-resend>Resend code</button>
                        <button class="btn btn-quiet btn-block" type="button" data-back="1">Back</button>
                    </div>
                </form>
            </section>

            <section data-auth-step="2" hidden>
                <h1>New password</h1>
                <p class="auth-sub">Set a password you haven't used on beeapp before.</p>

                <form id="reset-password" novalidate>
                    <div class="field">
                        <label for="new-password">Password</label>
                        <div class="field-pw">
                            <input class="input" id="new-password" type="password" autocomplete="new-password"
                                   data-strength="reset">
                            <button class="pw-toggle" type="button" data-pw-toggle="#new-password"
                                    aria-label="Show password" aria-pressed="false">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                        <p class="field-error" data-error="password" hidden></p>
                        <ul class="pw-rules" data-pw-rules="reset">
                            <li data-rule="length"><i data-lucide="check"></i>At least 8 characters</li>
                            <li data-rule="upper"><i data-lucide="check"></i>One capital letter</li>
                            <li data-rule="number"><i data-lucide="check"></i>One number</li>
                        </ul>
                    </div>

                    <div class="auth-actions">
                        <button class="btn btn-primary btn-lg btn-block" type="submit">Set password</button>
                        <button class="btn btn-quiet btn-block" type="button" data-back="2">Back</button>
                    </div>
                </form>
            </section>
        </div>
    </div>
</main>

</body>
</html>
