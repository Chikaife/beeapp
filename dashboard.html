<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview · beeapp</title>
    <meta name="description" content="Your beeapp wallet balance, payments and recent activity.">
    <link rel="icon" type="image/png" href="chidi logo.png" sizes="32x32">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/core.js" defer></script>
    <script src="js/banks.js" defer></script>
    <script src="js/shell.js" defer></script>
    <script src="js/receipt.js" defer></script>
    <script src="js/ledger.js" defer></script>
    <script src="js/overview.js" defer></script>
</head>
<body>

<div class="mobile-bar">
    <a href="/dashboard">beeapp</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Open navigation">
        <i data-lucide="menu"></i>
    </button>
</div>

<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="brand"><a href="/dashboard">beeapp</a></div>
        <nav class="nav" aria-label="Main">
            <a class="nav-item" href="/dashboard" aria-current="page"><i data-lucide="house" aria-hidden="true"></i><span>Overview</span></a>
            <a class="nav-item" href="/wallet?mode=transfer"><i data-lucide="arrow-left-right"></i><span>Transfer</span></a>
            <a class="nav-item" href="/wallet?mode=withdraw"><i data-lucide="banknote"></i><span>Withdraw</span></a>
            <a class="nav-item" href="/services"><i data-lucide="layout-grid"></i><span>Services</span></a>
            <a class="nav-item" href="/transactions"><i data-lucide="receipt-text"></i><span>Transactions</span></a>
        </nav>
        <div class="side-foot">
            <p class="sf-name" data-profile-name></p>
            <p class="sf-meta" data-profile-handle></p>
            <a class="sf-out" href="/index" data-signout><i data-lucide="log-out"></i><span>Sign out</span></a>
        </div>
    </aside>

    <main class="main">
        <header class="view-head">
            <div>
                <h1>Overview</h1>
            </div>
        </header>

        <section class="account-strip" aria-label="Wallet account">
            <div>
                <p class="field-label">Available balance</p>
                <div class="balance-line">
                    <p class="balance"><span class="cur">₦</span><span data-balance-value>0.00</span></p>
                    <button class="icon-btn" type="button" data-balance-toggle aria-label="Hide balance" aria-pressed="false">
                        <i data-lucide="eye"></i>
                    </button>
                </div>
                <p class="pending" data-pending-row>
                    <i data-lucide="clock-3" aria-hidden="true"></i>
                    <span>Pending</span>
                    <b data-pending>₦0.00</b>
                </p>
            </div>

            <div class="strip-right">
                <p class="wallet-id">
                    <span>Wallet <span class="num" data-wallet-number></span></span>
                    <button class="icon-btn" type="button" data-copy-wallet aria-label="Copy wallet number">
                        <i data-lucide="copy"></i>
                    </button>
                </p>
                <div class="strip-actions">
                    <a class="btn btn-primary" href="/wallet?mode=deposit">
                        <i data-lucide="plus"></i><span>Deposit</span>
                    </a>
                    <a class="btn btn-outline" href="/wallet?mode=transfer">
                        <i data-lucide="arrow-left-right"></i><span>Transfer</span>
                    </a>
                    <a class="btn btn-outline" href="/wallet?mode=withdraw">
                        <i data-lucide="banknote"></i><span>Withdraw</span>
                    </a>
                </div>
            </div>
        </section>

        <section class="section" aria-labelledby="services-title">
            <div class="section-head">
                <h2 id="services-title">Services</h2>
                <a class="btn-link" href="/services">All services</a>
            </div>
            <div class="service-row">
                <a class="service-tile" href="/services?service=airtime">
                    <i data-lucide="smartphone"></i><span>Airtime</span>
                </a>
                <a class="service-tile" href="/services?service=data">
                    <i data-lucide="wifi"></i><span>Data</span>
                </a>
                <a class="service-tile" href="/services?service=bill">
                    <i data-lucide="zap"></i><span>Bills</span>
                </a>
                <a class="service-tile" href="/services?service=betting">
                    <i data-lucide="dice-5"></i><span>Betting</span>
                </a>
            </div>
        </section>

        <section class="section" aria-labelledby="activity-title">
            <div class="section-head">
                <h2 id="activity-title">Recent activity</h2>
            </div>

            <div class="ledger">
                <div class="ledger-head" aria-hidden="true">
                    <span>Transaction</span>
                    <span>Date</span>
                    <span>Status</span>
                    <span>Amount</span>
                </div>
                <div data-recent-rows></div>
                <div class="ledger-foot">
                    <a class="btn-link" href="/transactions"><span>View all transactions</span><i data-lucide="arrow-right"></i></a>
                    <span class="foot-count" data-recent-count></span>
                </div>
            </div>
        </section>
    </main>
</div>

<div class="scrim" hidden></div>

</body>
</html>
