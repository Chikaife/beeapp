<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="dashboard.css">
    <script src="beeapp.js" defer></script>
    <title>beeapp | Wallet</title>
</head>
<body>
    <main class="wallet-page">
        <header class="topbar wallet-topbar">
            <a class="brand-mark" href="dashboard.html">beeapp</a>
            <a class="back-link" href="dashboard.html">Back to dashboard</a>
        </header>

        <section class="wallet-panel" aria-labelledby="wallet-title">
            <p class="eyebrow">Wallet</p>
            <h1 id="wallet-title">Deposit to wallet</h1>
            <p class="wallet-intro">Add funds or request a withdrawal using the form below.</p>

            <div class="wallet-balance-box">
                <span>Current balance</span>
                <strong data-wallet-balance>₦39,344,984.56</strong>
            </div>

            <div class="wallet-mode" role="group" aria-label="Choose wallet action">
                <button type="button" data-wallet-mode="deposit" aria-pressed="true">Deposit</button>
                <button type="button" data-wallet-mode="withdraw" aria-pressed="false">Withdraw</button>
            </div>

            <form id="wallet-form">
                <input id="wallet-mode" type="hidden" value="deposit">
                <label class="form-field" for="wallet-amount">Amount</label>
                <div class="amount-input"><span>₦</span><input id="wallet-amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></div>
                <fieldset class="bank-details" id="withdrawal-bank-details" hidden>
                    <legend>Bank details</legend>
                    <label class="form-field" for="bank-name">Bank name</label>
                    <input id="bank-name" name="bankName" type="text" autocomplete="off" placeholder="Enter your bank name">
                    <label class="form-field" for="account-number">Account number</label>
                    <input id="account-number" name="accountNumber" type="text" inputmode="numeric" autocomplete="off" maxlength="20" pattern="[0-9]{6,20}" placeholder="Enter your">
                </fieldset>
                <p class="form-feedback" id="wallet-feedback" role="status" aria-live="polite"></p>
                <button class="solid-button wallet-submit" id="wallet-submit" type="submit">Add funds</button>
            </form>
            <p class="wallet-disclaimer"><span id="wallet-activity-label">Deposit</span> will appear in your recent activity.</p>
        </section>
    </main>
</body>
</html>
